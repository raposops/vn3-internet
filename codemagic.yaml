workflows:
  ios-app-store:
    name: VN3 Internet iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic_integration
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.vn3internet.app"
        # ── Vite env vars (injetadas no build) ──
        VITE_SUPABASE_PROXY_URL: "https://zqdcoaadqxrpnhsxevac.supabase.co/functions/v1/ixc-proxy"
        VITE_API_URL: "https://4419.ixcsoft.com/webservice/v1"
        VITE_FIREBASE_API_KEY: "AIzaSyDqCfmi780W095Ckggvk_nXkgAECtQlR4E"
        VITE_FIREBASE_AUTH_DOMAIN: "vn3-internet.firebaseapp.com"
        VITE_FIREBASE_PROJECT_ID: "vn3-internet"
        VITE_FIREBASE_STORAGE_BUCKET: "vn3-internet.firebasestorage.app"
        VITE_FIREBASE_MESSAGING_SENDER_ID: "782914678496"
        VITE_FIREBASE_APP_ID: "1:782914678496:android:e0fe0c16e61eb14873aa85"
      xcode: latest
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Create .env for Vite build
        script: |
          echo "VITE_SUPABASE_PROXY_URL=$VITE_SUPABASE_PROXY_URL" > .env
          echo "VITE_API_URL=$VITE_API_URL" >> .env
          echo "VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY" >> .env
          echo "VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN" >> .env
          echo "VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID" >> .env
          echo "VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET" >> .env
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID" >> .env
          echo "VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID" >> .env
          echo "── .env criado para build ──"
          cat .env
      - name: Install npm dependencies
        script: |
          npm install
      - name: Build web assets
        script: |
          npm run build
      - name: Sync Capacitor iOS
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --project="$XCODE_PROJECT" \
            --scheme="$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - ios/App/build/build_output/apps/*.ipa
    publishing:
      app_store_connect:
        auth: integration