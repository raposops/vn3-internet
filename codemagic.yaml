workflows:
  ios-app-store:
    name: VN3 Internet iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      groups:
        - app_store_credentials # Vamos configurar esse grupo no próximo passo
      vars:
        XCODE_PROJECT: "ios/vn3internet.xcodeproj" # Desenvolvedor deve ajustar se o nome for diferente
        XCODE_SCHEME: "vn3internet" # Desenvolvedor deve ajustar para o scheme correto do projeto
      xcode: 15.4 # Versão do Xcode na nuvem
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install
      - name: Xcode build and code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-properties
          xcode-project use-profiles
          xcode-project build-ipa --project="$XCODE_PROJECT" --scheme="$XCODE_SCHEME"
    artifacts:
      - ios/build/build_output/apps/*.ipa
    publishing:
      app_store_connect:
        auth: integration
    integrations:
      app_store_connect: codemagic_integration