workflows:
  ios-app-store:
    name: VN3 Internet iOS App Store
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: codemagic_integration # <--- ADICIONE ESSAS DUAS LINHAS AQUI
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: 'main'
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Xcode build and code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.vn3internet.app" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
          xcode-project build-ipa --project="$XCODE_PROJECT" --scheme="$XCODE_SCHEME"
    artifacts:
      - ios/build/build_output/apps/*.ipa
    publishing:
      app_store_connect:
        auth: integration